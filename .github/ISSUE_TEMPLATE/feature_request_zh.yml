name: 功能建议（简体中文）
description: 为本产品仓库提出范围明确的改进建议。
title: "[Feature] "
labels: []
assignees: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题或使用场景
      description: 请说明该建议要解决的客户或维护问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为
      description: 请描述期望结果，无需预设具体实现。
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: 开发板和示例范围
      placeholder: ESP32-P4-WIFI6-Touch-LCD-7B；examples/esp-idf/...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: textarea
    id: evidence
    attributes:
      label: 硬件或兼容性考虑
      description: 请包括所需外设、ESP-IDF 版本以及协议或固件边界。
  - type: checkboxes
    id: checks
    attributes:
      label: 检查项
      options:
        - label: 我已搜索已有 Issue，并将建议范围限定在本产品仓库。
          required: true
