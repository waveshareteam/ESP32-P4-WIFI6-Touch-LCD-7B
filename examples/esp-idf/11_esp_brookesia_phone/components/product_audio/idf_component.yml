dependencies:
  idf:
    version: '>=5.3.0'

  waveshare/esp32_p4_wifi6_touch_lcd_7b:
    # Exact 3.0.0 keeps the app-owned audio adapter on the current stable board API.
    version: "==3.0.0"

  espressif/esp_lcd_ek79007:
    # Matches the Waveshare BSP 3.0.0 display-driver contract.
    version: "==2.0.2~1"

  chmorgan/esp-audio-player:
    # Pin the audio-player API; this component declares its required ESP-IDF driver dependencies explicitly.
    version: "==1.1.0"
    public: true

  chmorgan/esp-file-iterator:
    version: "1.0.0"
    public: true

description: Application-owned audio and file-player adapter using the managed board BSP
targets:
- esp32p4
version: 0.0.2
